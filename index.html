<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PanelGen Web – Configuratore pannelli 3D</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--bd:#ddd;--ac:#2563eb;--pn:#f6f6f7;--wr:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--fg:#eee;--mut:#999;--bd:#333;--ac:#5b8cff;--pn:#1e1e21;--wr:#fbbf24}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:13px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
#app{display:flex;height:100%}
aside{width:380px;max-width:100%;overflow-y:auto;padding:12px;background:var(--pn);border-right:1px solid var(--bd)}
main{flex:1;position:relative;min-width:0}
canvas{width:100%;height:100%;display:block;cursor:grab}
h1{font-size:17px;margin:0 0 8px}
details{border:1px solid var(--bd);border-radius:8px;margin:8px 0;background:var(--bg)}
summary{cursor:pointer;padding:8px 10px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.in{padding:2px 10px 10px}
.row{margin:7px 0 0}
.row>label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:1px}
.row .c{display:flex;gap:6px;align-items:center}
input[type=range]{flex:1;min-width:0}
input[type=number]{width:70px;padding:3px;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--fg)}
select,input[type=text],input[type=email],textarea{width:100%;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
button{padding:8px 11px;border:0;border-radius:6px;background:var(--ac);color:#fff;font:inherit;cursor:pointer;margin:4px 4px 0 0}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--bd)}
#info{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--mut);white-space:pre-line}
#warn{color:var(--wr);font-size:12px;margin-top:6px}
#msg{margin-top:8px;color:var(--ac)}
.note{font-size:11px;color:var(--mut);margin-top:6px}
@media(max-width:760px){#app{flex-direction:column-reverse}aside{width:100%;height:58%;border-right:0;border-top:1px solid var(--bd)}main{height:42%;flex:none}}
</style>
</head>
<body>
<div id="app">
<aside>
 <h1>PanelGen Web</h1>
 <div id="ui"></div>
 <details open><summary>Il tuo contatto</summary><div class="in">
  <input type="text" id="nome" placeholder="Nome e cognome" autocomplete="name">
  <div class="row"><input type="text" id="tel" placeholder="Telefono" autocomplete="tel" inputmode="tel"></div>
  <div class="row"><input type="email" id="email" placeholder="Email" autocomplete="email"></div>
  <div class="row"><textarea id="note" rows="3" placeholder="Note o richieste"></textarea></div>
  <input type="text" id="hp" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
  <div class="row"><label style="display:block"><input type="checkbox" id="priv"> Acconsento al trattamento dei miei dati per ricevere il riepilogo e essere ricontattato. <span style="color:var(--mut)">(Informativa privacy: <a href="privacy.html" target="_blank">leggi</a>)</span></label></div>
 </div></details>
 <div>
  <button id="bSend">Invia la mia configurazione</button>
  <button id="bPdf" class="sec">Scarica PDF</button>
  <button id="bCopy" class="sec">Copia configurazione</button>
  <button id="bLoad" class="sec">Carica configurazione</button>
 </div>
 <details id="exp"><summary>Esporta per stampa 3D</summary><div class="in">
  <button id="bStlAll" class="sec">Pannello intero (STL)</button>
  <button id="bStlNoBase" class="sec">Solo rilievi (STL)</button>
  <button id="bZipInd" class="sec">Singoli senza base (ZIP)</button>
  <button id="bZipBase" class="sec">Singoli con base (ZIP)</button>
  <button id="bZipSec" class="sec">Settori con base (ZIP)</button>
  <div class="note">Gli STL conservano le coordinate del pannello. Gli ZIP includono un manifest.json con righe, colonne e offset.</div>
 </div></details>
 <div id="warn"></div><div id="msg"></div>
 <input type="file" id="fLoad" accept=".json" hidden>
</aside>
<main><canvas id="c"></canvas><div id="info"></div></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ====== DA PERSONALIZZARE ====== */
const OWNER_EMAIL = "tua@email.it";   // fallback: apre l'email del cliente
const WORKER_URL = "";                 // URL del Cloudflare Worker (vedi worker.js): invia la mail al cliente e il 3D a te
const SEND_STL = true;                 // allega l'STL alla mail che ricevi tu (se supera 8 MB viene inviato solo il link)
const FORM_URL = "";                   // alternativa senza worker: es. "https://formspree.io/f/xxxxxxx" (solo testo)
const SHOW_EXPORT_TO_CLIENT = true;    // false = nasconde la sezione export STL/ZIP al cliente
/* =============================== */

const $=id=>document.getElementById(id),D2R=Math.PI/180,clamp=(x,a=0,b=1)=>Math.min(Math.max(x,a),b);

/* ---------- Schema dei controlli (nomi e valori di default = PanelGen Studio 1.0) ---------- */
const R=(k,l,mn,mx,st,df,show)=>({k,l,t:'r',mn,mx,st,df,show}),S=(k,l,o,df,show)=>({k,l,t:'s',o,df,show}),C=(k,l,df,show)=>({k,l,t:'c',df,show});
const orbOn=c=>c.orbOn,orbOff=c=>!c.orbOn;
const SCHEMA=[
{g:'Numero e dimensione degli oggetti',open:1,f:[
 R('W','Larghezza pannello (mm)',10,2000,1,300),R('L','Lunghezza pannello (mm)',10,2000,1,300),
 R('cntX','Colonne X',1,200,1,5),R('cntY','Righe Y',1,200,1,8),
 S('sizeMode','Dimensione',['Automatico massimo','Diametro manuale'],0),
 R('blkD','Diametro blocco (mm)',0.4,500,0.1,34,c=>c.sizeMode==1),
 S('gapMode','Spaziatura',['Riempimento precedente','Gap esatto, forme invariate'],1),
 R('gap','Gap (mm) – 0 unisce il layer',0,30,0.1,1),
 R('gapFloor','Gap minimo (mm)',0.4,30,0.1,0.4)]},
{g:'Altezza',open:1,f:[
 S('driver','Sorgente',['Picco mobile','Picchi procedurali','Immagine B/N','Noise','Combinato'],0),
 R('minH','Altezza minima (mm)',0.8,100,0.1,6),R('maxH','Altezza massima (mm)',1,500,0.5,40),
 R('pkR','Raggio influenza (mm)',1,2000,1,120),R('soft','Inizio decadimento (mm)',0,1900,1,0),
 S('fallT','Tipo di decadimento',['Lineare','Smooth','Esponenziale','Gaussiano'],1),
 R('fallP','Potenza (esponenziale)',0.1,10,0.1,2,c=>c.fallT==2),
 R('cx','Centro picco X (mm)',-1000,1000,1,0),R('cy','Centro picco Y (mm)',-1000,1000,1,0),
 R('cs','Scala influenza',0.1,10,0.05,1),R('EF','Scala effetto',0.01,10,0.01,1),
 R('HS','Scala altezza',0.01,10,0.01,1),C('inv','Inverti altezza',false),
 R('hNoise','Variazione altezza da flusso (mm)',0,50,0.5,0),
 R('flowScale','Scala flusso (mm)',1,2000,1,150),R('flowOct','Ottave flusso',0,8,1,2),R('flowSeed','Seme flusso',0,1000000,1,0)]},
{g:'Picchi procedurali',f:[
 R('pkCount','Numero picchi',1,64,1,3,c=>c.driver==1),R('pkSeed','Seme picchi',0,1000000,1,0,c=>c.driver==1),
 R('pkOX','Offset picchi X',-2000,2000,1,0,c=>c.driver==1),R('pkOY','Offset picchi Y',-2000,2000,1,0,c=>c.driver==1),
 S('comb','Combinazione',['Max','Smooth Max','Somma limitata'],0,c=>c.driver==1)]},
{g:'Mappa B/N (immagine)',f:[
 {k:'img',t:'file',l:'Immagine B/N'},
 R('imgC','Contrasto mappa',0.01,10,0.01,1),C('imgInv','Inverti mappa',false),
 R('imgS','Scala mappa',0.01,20,0.01,1),R('imgOX','Offset mappa X',-10,10,0.01,0),R('imgOY','Offset mappa Y',-10,10,0.01,0)]},
{g:'Noise (sorgente altezza)',f:[
 R('nScale','Scala noise (mm)',1,2000,1,120),R('nDet','Dettaglio noise',0,8,1,2),R('nSeed','Variante noise',-1000,1000,1,0),R('nCon','Contrasto noise',0.01,10,0.01,1.5)]},
{g:'Orbita comune – basi bloccate',open:1,f:[
 C('orbOn','Tip Orbit attivo',true),C('orbFree','Anteprima libera 0–360° (non certificata)',true,orbOn),
 R('orbAng','Tip Orbit Angle (°)',0,360,1,15,orbOn),S('orbDir','Direzione',['Antiorario','Orario'],0,orbOn),
 R('orbR','Raggio influenza (mm)',1,2000,1,150,orbOn),R('twSeg','Segmenti verticali',1,24,1,12,orbOn)]},
{g:'Forma – base / punta',open:1,f:[
 S('src','Tipo di blocco',['Cono / piramide N-gono','Prisma'],0),
 R('sides','Lati',3,64,1,5),R('topR','Rapporto raggio punta',0.01,1,0.01,0.15,c=>c.src==0),
 R('baseS','Scala base',0.05,2,0.01,1),R('tipS','Scala punta',0.05,4,0.01,1),
 S('shT','Estremità da scalare',['Base','Punta','Entrambe'],2),R('shS','Scala selezionata',0.05,2,0.01,1),
 S('scMode','Modalità scala',['Solo Z','Uniforme','Z + compensazione conicità'],0)]},
{g:'Torsione locale / Tip Vortex (solo con Orbita disattiva)',f:[
 R('OM','Organic master',0,1,0.01,0.5,orbOff),R('twAmt','Torsione (°)',0,720,1,60,orbOff),
 S('twMode','Modo torsione',['Costante','Per altezza','Per angolo vortice','Per flusso'],0,orbOff),
 S('twEase','Easing torsione',['Lineare','Ease-in','Ease-out','Curva S'],1,orbOff),
 S('twDir','Direzione torsione',['Antiorario','Orario','Segno del flusso'],0,orbOff),
 R('twStart','Inizio torsione',0,0.9,0.01,0.25,orbOff),R('tipRot','Rotazione punta (°)',-360,360,1,45,orbOff),
 R('lean','Inclinazione (°)',0,60,0.5,0,orbOff),
 C('tvOn','Tip Vortex attivo',true,orbOff),R('tvAmt','Tip Vortex (mm)',0,30,0.1,6,orbOff),
 R('tfStart','Inizio flusso punta',0,0.9,0.01,0,orbOff),S('tfEase','Easing flusso punta',['Lineare','Ease-in','Curva S'],1,orbOff),
 R('swR','Raggio vortice (mm)',1,2000,1,150,orbOff),R('swA','Angolo vortice (°)',0,1440,1,270,orbOff),
 R('swArms','Bracci vortice',1,16,1,1,orbOff),S('swDir','Direzione vortice',['Antiorario','Orario'],0,orbOff),
 S('swFall','Decadimento vortice',['Lineare','Smooth','Esponenziale','Gaussiano'],1,orbOff),
 R('swCoup','Accoppiamento altezza/vortice',0,1,0.01,0,orbOff)]},
{g:'Limiti di stampa',f:[
 R('minFeat','Dettaglio minimo (mm)',0.4,10,0.1,0.8),R('minTip','Diametro minimo punta (mm)',0.4,20,0.1,1.2),
 R('minBase','Diametro minimo base (mm)',0.8,50,0.1,4),R('maxAR','Rapporto massimo altezza/diametro',0.1,10,0.1,3),
 R('maxOv','Sbalzo massimo (°)',0,80,1,45),R('baseTol','Tolleranza base (mm)',0.001,0.2,0.001,0.05)]},
{g:'Base del pannello e layer continuo',f:[
 C('bpOn','Base aggiuntiva visibile',false),R('bpT','Spessore base aggiuntiva (mm)',0.8,20,0.1,3,c=>c.bpOn),
 C('zgOn','Gap zero: layer continuo',true),R('zgT','Spessore layer a gap zero (mm)',0.1,20,0.1,0.8),
 C('keepPos','Mantieni coordinate del pannello nell\'export',true),
 R('exX','Ingombro max X (mm)',10,2000,1,220),R('exY','Ingombro max Y (mm)',10,2000,1,220),R('exZ','Ingombro max Z (mm)',10,2000,1,220)]},
{g:'Aspetto anteprima',f:[{k:'color',t:'col',l:'Colore'}]}
];
const cfg={},FIELDS=[];SCHEMA.forEach(g=>g.f.forEach(f=>{FIELDS.push(f);if(f.df!==undefined)cfg[f.k]=f.df}));
cfg.color='#e8e4dc';

/* ---------- Immagine heightmap ---------- */
let IMG=null;
function loadImg(file){const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=256;const x=cv.getContext('2d');x.drawImage(im,0,0,256,256);IMG=x.getImageData(0,0,256,256).data;sched()};im.src=URL.createObjectURL(file)}
function imgGray(u,v){if(!IMG)return 0;const px=clamp(u,0,.9999)*255,py=(1-clamp(v,0,.9999))*255,x0=Math.floor(px),y0=Math.floor(py),fx=px-x0,fy=py-y0;
 const g=(x,y)=>{const i=(Math.min(y,255)*256+Math.min(x,255))*4;return(.2126*IMG[i]+.7152*IMG[i+1]+.0722*IMG[i+2])/255};
 return(g(x0,y0)*(1-fx)+g(x0+1,y0)*fx)*(1-fy)+(g(x0,y0+1)*(1-fx)+g(x0+1,y0+1)*fx)*fy}

/* ---------- Noise (approssimazione del Noise Texture di Blender) ---------- */
const h3=(x,y,z,s)=>{const n=Math.sin(x*127.1+y*311.7+z*74.7+s*19.19)*43758.5453;return n-Math.floor(n)};
function vn(x,y,z,s){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf),l=(a,b,t)=>a+(b-a)*t;
 return l(l(l(h3(xi,yi,zi,s),h3(xi+1,yi,zi,s),u),l(h3(xi,yi+1,zi,s),h3(xi+1,yi+1,zi,s),u),v),l(l(h3(xi,yi,zi+1,s),h3(xi+1,yi,zi+1,s),u),l(h3(xi,yi+1,zi+1,s),h3(xi+1,yi+1,zi+1,s),u),v),w)}
function fbm(x,y,z,oct,s){let a=1,f=1,t=0,m=0;for(let i=0;i<=oct;i++){t+=a*vn(x*f,y*f,z*f,s);m+=a;a*=.5;f*=2}return .5+(t/m-.5)*1.3}
function prng(seed){let s=(seed*2654435761+12345)>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

/* ---------- Funzioni del plugin ---------- */
function fall(u,kind,pw){u=clamp(u);const q=1-u;
 if(kind==1)return q*q*(3-2*q);if(kind==2)return Math.pow(q,pw);if(kind==3)return(Math.exp(-4*u*u)-Math.exp(-4))/(1-Math.exp(-4));return q}
const ease=(k,t)=>[t,t*t,1-Math.pow(1-t,2),t*t*(3-2*t)][k];
const rot=(x,y,a)=>[x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)];

/* ---------- Layout: modalità "Numero X/Y" ---------- */
function layout(c){
 const n=clamp(Math.round(c.sides),3,64),exact=c.gapMode==1;
 let fxlo=1e9,fxhi=-1e9,fylo=1e9,fyhi=-1e9;
 for(let k=0;k<n;k++){const a=2*Math.PI*k/n,x=Math.cos(a),y=Math.sin(a);fxlo=Math.min(fxlo,x);fxhi=Math.max(fxhi,x);fylo=Math.min(fylo,y);fyhi=Math.max(fyhi,y)}
 const fw=fxhi-fxlo,fh=fyhi-fylo,W=c.W,L=c.L;
 const zeroGap=c.zgOn&&Math.abs(c.gap)<1e-7,gap=zeroGap?0:Math.max(c.gap,c.gapFloor,.4);
 const lean=c.maxH*Math.tan(Math.min(c.lean*c.OM,c.maxOv)*D2R),fitGap=exact?gap:gap+2*lean;
 const tf=[c.shS,1,c.shS][c.shT],fitFactor=clamp(c.baseS*tf,1e-4,1);
 const baseFloor=.5*c.minBase,needed=Math.max(baseFloor,c.minH/Math.max(.001,2*c.maxAR));
 const fitRmin=needed>baseFloor+1e-4?needed/fitFactor:baseFloor;
 const fitMinBase=clamp(fitRmin*fitFactor,baseFloor,fitRmin);
 let mNX,mNY;
 if(exact){mNX=Math.max(1,Math.floor((W+gap)/(fw*fitMinBase+gap)));mNY=Math.max(1,Math.floor((L+gap)/(fh*fitMinBase+gap)))}
 else{mNX=Math.max(1,1+Math.floor((W-fw*fitMinBase)/(2*fitRmin+fitGap)));mNY=Math.max(1,1+Math.floor((L-fh*fitMinBase)/(2*fitRmin+fitGap)))}
 const nx=Math.min(clamp(Math.round(c.cntX),1,200),mNX),ny=Math.min(Math.min(clamp(Math.round(c.cntY),1,200),mNY),Math.floor(20000/nx));
 let Rmax;
 if(exact){const bx=(W-(nx-1)*gap)/Math.max(1e-4,nx*fw),by=(L-(ny-1)*gap)/Math.max(1e-4,ny*fh);Rmax=Math.max(0,Math.min(bx,by))}
 else{const ax=(span,w,n)=>{const iv=Math.max(0,n-1),num=span-iv*fitGap,lin=num/Math.max(1e-4,w*fitFactor+2*iv),res=num-w*baseFloor,fx=res/Math.max(1e-4,2*iv),sg=res>-1e-4?1e6:0;return Math.max(0,Math.min(lin,n>1.5?fx:sg))};
  Rmax=Math.min(ax(W,fw,nx),ax(L,fh,ny))}
 const fitR=c.sizeMode==0?Rmax:Math.min(Rmax,Math.max(fitRmin,.5*c.blkD)),base=clamp(fitR*fitFactor,baseFloor,fitR);
 let pX,pY;
 if(exact){pX=fw*base+gap;pY=fh*base+gap}
 else{pX=nx>1.5?(W-fw*base)/Math.max(1,nx-1):Math.max(W,2*fitR+fitGap);pY=ny>1.5?(L-fh*base)/Math.max(1,ny-1):Math.max(L,2*fitR+fitGap)}
 const pts=[];
 for(let idx=0;idx<Math.min(nx*ny,20000);idx++){
  const row=Math.floor(idx/nx),col=idx%nx;let x,y;
  if(exact){x=(col-.5*(nx-1))*pX-.5*(fxlo+fxhi)*base;y=(row-.5*(ny-1))*pY-.5*(fylo+fyhi)*base}
  else{x=nx>1.5?-.5*W-fxlo*base+col*pX:-.5*(fxlo+fxhi)*base;y=ny>1.5?-.5*L-fylo*base+row*pY:-.5*(fylo+fyhi)*base}
  const inside=x+fxlo*base>-.5*W-1e-4&&x+fxhi*base<.5*W+1e-4&&y+fylo*base>-.5*L-1e-4&&y+fyhi*base<.5*L+1e-4;
  if(inside&&2*fitR>c.minBase-1e-4)pts.push({x,y,col,row,cx:(col-.5*(nx-1))*pX,cy:(row-.5*(ny-1))*pY});
 }
 return{n,nx,ny,R:fitR,base,pX,pY,pts,gap,exact,zeroGap,lean,fw,fh,fxlo,fxhi,fylo,fyhi,fitFactor,Rmax,gapReal:[pX-fw*base,pY-fh*base],used:[nx*fw*base+(nx-1)*gap,ny*fh*base+(ny-1)*gap]}
}

/* ---------- Generazione geometria ---------- */
function build(c){
 const lay=layout(c),n=lay.n,EF=c.EF,R=lay.R,P=[],blocks=[];
 const ctrlRad=Math.max(.001,c.cs),ctr=[c.cx,c.cy],orbH=Math.max(.001,c.maxH);
 const tfB=[c.shS,1,c.shS][c.shT],tfT=[1,c.shS,c.shS][c.shT],baseF=c.baseS*tfB,tipF=c.tipS*tfT;
 const orbInf=Math.max(.001,c.orbR*EF*ctrlRad),free=c.orbOn&&c.orbFree;
 /* angolo orbitale effettivo */
 let orbAngle=0,orbLimit=0;
 if(c.orbOn){
  const envR=R,obr=clamp(envR*baseF,.5*c.minBase,envR),otratio=c.src==1?1:c.topR;
  const otmin=Math.max(c.minTip,c.minFeat)/(2*Math.cos(Math.PI/n)),otr=clamp(envR*otratio*tipF,otmin,envR);
  let orbRadius=Math.max(obr,otr);if(c.scMode==2)orbRadius=envR;
  let maxd=0;lay.pts.forEach(p=>maxd=Math.max(maxd,Math.hypot(p.x-ctr[0],p.y-ctr[1])));
  const rb=Math.max(.001,maxd+orbRadius),cGap=Math.min(lay.pX-lay.fw*orbRadius,lay.pY-lay.fh*orbRadius),initGap=Math.max(.0001,cGap);
  const over=Math.tan(c.maxOv*D2R),vC=Math.min(rb,.27*orbInf)/orbH,rC=8/9,shC=Math.hypot(vC,rC),aOver=Math.min(Math.PI/2,over/Math.max(.0001,vC));
  const seg=clamp(c.twSeg,12,24),sag=aOver*aOver*(.19*orbInf)/(4*seg*seg),reqGap=lay.gap+sag+.0001,sN=clamp(reqGap/initGap,.0001,1),cl=Math.max(0,1/sN-sN);
  orbLimit=Math.min(aOver,cl/Math.max(.0001,shC));
  const req=D2R*clamp(Math.abs(c.orbAng),0,360);
  orbAngle=(c.orbDir==0?1:-1)*(free?req:Math.min(req,orbLimit));
 }
 /* picchi procedurali */
 const peaks=[];
 {const r=prng(c.pkSeed);for(let i=0;i<c.pkCount;i++){let x=0,y=0;if(c.pkCount>1){x=(r()*2-1)*.6*.5*c.W;y=(r()*2-1)*.6*.5*c.L}peaks.push([x+c.pkOX,y+c.pkOY])}}
 const swC=[0,0],swAng=c.swA*D2R;let removed=0;
 for(const p of lay.pts){
  const rest=[p.x,p.y],dc=[rest[0]-ctr[0],rest[1]-ctr[1]],crd=Math.hypot(dc[0],dc[1]);
  const cR=Math.max(.001,c.pkR*EF*ctrlRad),cS=Math.min(c.soft*EF*ctrlRad,.95*cR);

async function send(){
 const nome=$('nome').value.trim(),tel=$('tel').value.trim(),email=$('email').value.trim();
 if(!nome||!/^[+()\d\s.\-]{6,20}$/.test(tel)||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){say('Inserisci nome, telefono ed email validi.');return}
 if(!$('priv').checked){say('Serve il consenso al trattamento dei dati.');return}
 say('Invio in corso…');
 const dm=dims(),link=location.origin+location.pathname+'#cfg='+encodeURIComponent(btoa(JSON.stringify(cfg)));
 const txt=summary()+'\n\nCliente: '+nome+'\nTelefono: '+tel+'\nEmail: '+email+'\nNote: '+$('note').value+'\nIngombro max (mm): '+dm.join(' x ')+'\nApri la configurazione: '+link;
 if(WORKER_URL){try{
  const payload={nome,tel,email,note:$('note').value,hp:$('hp').value,dims:dm,thumb:thumb(),summary:summary(),config:cfg,link,hasImage:!!IMG};
  if(SEND_STL){const b=stlBlob([Array.from(M.pos),baseTris(M,panelRect(cfg))]);if(b.size<8e6)payload.stl=await b64(b)}
  const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  say(r.ok?'Fatto! Ti abbiamo inviato una email di riepilogo.':'Invio non riuscito, riprova.');return}catch(e){say('Invio non riuscito, riprova.');return}}
 if(FORM_URL){try{const r=await fetch(FORM_URL,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
  body:JSON.stringify({nome,telefono:tel,email,note:$('note').value,ingombro_mm:dm.join(' x '),configurazione:summary(),link})});
  say(r.ok?'Configurazione inviata, grazie!':'Invio non riuscito, riprova.');return}catch(e){say('Invio non riuscito, riprova.');return}}
 location.href='mailto:'+OWNER_EMAIL+'?subject='+encodeURIComponent('Configurazione pannello 3D')+'&body='+encodeURIComponent(txt);
 say('Si apre la tua email: premi Invia per spedire la configurazione.')}
$('bPdf').onclick=pdf;$('bSend').onclick=send;
$('bCopy').onclick=()=>{const j=JSON.stringify(cfg);save(new Blob([j],{type:'application/json'}),'configurazione-pannello.json');navigator.clipboard&&navigator.clipboard.writeText(summary()).catch(()=>{});say('Configurazione scaricata (JSON) e copiata come testo.')};
$('bLoad').onclick=()=>$('fLoad').click();
$('fLoad').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);FIELDS.forEach(x=>{if(x.k in o&&x.set)x.set(o[x.k])});sched();say('Configurazione caricata.')}catch(err){say('File non valido.')}})};
try{const m=location.hash.match(/#cfg=([^&]+)/);if(m){const o=JSON.parse(atob(decodeURIComponent(m[1])));FIELDS.forEach(x=>{if(x.k in o&&x.set)x.set(o[x.k])})}}catch(e){}
resize();update();
</script>
</body>
</html>
